# Push a tag like v0.9.0-beta.1 (matching DaybookVersion in lib\Config.ahk)
# and this tests the app, builds both zips and publishes them as a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get AutoHotkey 1.1.37.02
        shell: pwsh
        # the same exe that runs the tests goes into the portable zip, so what
        # is shipped is what was tested
        run: |
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk-zip
          New-Item -ItemType Directory ahk | Out-Null
          foreach ($f in "AutoHotkeyU64.exe", "license.txt") {
            $found = Get-ChildItem ahk-zip -Recurse -Filter $f | Select-Object -First 1
            if (-not $found) { throw "$f is not in the AutoHotkey zip" }
            Copy-Item $found.FullName ahk
          }

      - name: Test (it loads, and the rules hold)
        shell: pwsh
        run: .\tests\run-tests.ps1 -Exe .\ahk\AutoHotkeyU64.exe

      - name: Build
        shell: pwsh
        run: .\build.ps1 -AhkDir .\ahk

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # notes from CHANGELOG.md (build.ps1); a version with a dash in it -
        # 0.9.0-beta.1 - is a pre-release, which the "latest" link skips.
        #
        # Moving a tag that has already been released has to WORK rather than
        # fail halfway: a typo in the notes should not cost a version number.
        # So publish if it is new, and replace the notes and both zips if it
        # is not.
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart("v")
          $pre = if ($v.Contains("-")) { "--prerelease" } else { "--latest" }
          $zips = "dist/Daybook-$v-portable.zip", "dist/Daybook-$v.zip"
          gh release view $env:GITHUB_REF_NAME 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --title "Daybook $v" --notes-file dist/notes.md $pre
            if ($LASTEXITCODE) { throw "gh release edit failed" }
            gh release upload $env:GITHUB_REF_NAME @zips --clobber
            if ($LASTEXITCODE) { throw "gh release upload failed" }
          } else {
            gh release create $env:GITHUB_REF_NAME @zips --title "Daybook $v" --notes-file dist/notes.md $pre
            if ($LASTEXITCODE) { throw "gh release create failed" }
          }
